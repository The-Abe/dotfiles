# Prefix
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

#Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Options
set-window-option -g mode-keys vi
set -sg escape-time 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 5000
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"
set -ga terminal-overrides ",alacritty:Tc"
setw -g monitor-activity off
set -g visual-activity on
set -sg repeat-time 600
set -s focus-events on
set -g status "on"
set -g set-titles on
set -g set-titles-string "TMUX #I:#W"
set-window-option -g automatic-rename off
set-window-option -g allow-rename on
set-option -g detach-on-destroy off
set -g extended-keys on
#Binds
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind -r tab last-window
# in normal tmux mode
bind Escape copy-mode
bind C-u copy-mode
# in copy mode…
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi V send -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi Escape send-keys -X cancel
bind C-b split-window -v -c "#{pane_current_path}"
bind C-v split-window -h -c "#{pane_current_path}"
bind C-d killp
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
unbind n
unbind p
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind -r C-k swap-window -t +1\; select-window -t +1
bind -r C-j swap-window -t -1\; select-window -t -1
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
#bind c new-window \; command-prompt "rename-window '%%'"
bind c command-prompt -p "New Window:" "new-window -c '#{pane_current_path}' -n \"#{?#{==:'%%',''},zsh,%1}\""
bind , command-prompt "rename-window '%%'"
bind C-s new \; command-prompt "rename-session '%%'"
bind s display-popup -E -w 60% -h 50% "~/.tmux/session-switcher"
bind w display-popup -E -w 80% -h 60% "~/.tmux/window-switcher"
bind Enter run-shell 'toggleterm'
bind \\ set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
bind m set mouse\; display-message "mouse is now #{?mouse,on,off}"
bind / command-prompt -p "send pane to:" "join-pane -t ':%%'"
# - prefix for windows between 10 and 19
bind - switch-client -Tabove9
bind -Tabove9 0 select-window -t:10
bind -Tabove9 1 select-window -t:11
bind -Tabove9 2 select-window -t:12
bind -Tabove9 3 select-window -t:13
bind -Tabove9 4 select-window -t:14
bind -Tabove9 5 select-window -t:15
bind -Tabove9 6 select-window -t:16
bind -Tabove9 7 select-window -t:17
bind -Tabove9 8 select-window -t:18
bind -Tabove9 9 select-window -t:19
set-option -g status-position bottom
setw -g pane-border-status top
set-hook -g pane-focus-in 'if-shell -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set-hook -g pane-exited 'if-shell -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set -g pane-border-style fg=#665c54
set -g pane-active-border-style fg=#665c54
set -g pane-border-format "#{?pane_active,#[fg=#fe8019] #{pane_title} ,#[fg=#665c54] #{pane_title} }"
set -g message-style fg='#b8bb26'
set -g status-style fg='#ebdbb2',bg='#1d2021'
set -g status-interval 5
setw -g window-status-separator ' '
set -g status-right-length 120
set -g status-left-length 40
set -g status-bg '#1d2021'
set -g status-fg '#ebdbb2'
set -g window-status-format '#[fg=#a89984,bg=#282828,bold] #W #[fg=#1d2021,bg=#1d2021] '
set -g window-status-current-format '#[fg=#1d2021,bg=#fe8019] #W #[fg=#1d2021,bg=#1d2021] '
set -g status-format[0] '#[fg=#fabd2f,bg=#282828,bold] #S #[fg=#1d2021,bg=#1d2021] #{W:#{E:window-status-format},#{E:window-status-current-format}}#[fg=#b8bb26,bg=#282828,bold] #{pane_current_path} '

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind p display-popup -E -w 80% -h 60% "~/.tmux/sessionizer"
run '~/.tmux/plugins/tpm/tpm'
set -g pane-border-lines heavy

# Smart split helper function to open the argument command in a vertical or
# horizontal split based on terminal aspect ratio.
set-environment -g SMART_SPLIT 'smart_split() { \
  w=$(tmux display-message -p "#{pane_width}"); \
  h=$(tmux display-message -p "#{pane_height}"); \
  path=$(tmux display-message -p "#{pane_current_path}"); \
  if [ "$w" -gt "$h" ]; then dir="-h"; else dir="-v"; fi; \
  tmux split-window $dir -c "$path" "$1"; \
}; smart_split'

bind-key a run-shell "$SMART_SPLIT opencode"
