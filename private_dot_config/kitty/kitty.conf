font_family                JetBrainsMono Nerd Font
font_features              JetBrainsMonoNF-Regular +calt +liga +clig
font_features              JetBrainsMonoNF-Bold +calt +liga +clig
font_features              JetBrainsMonoNF-Italic +calt +liga +clig
font_size                  11.0
adjust_line_height         0
adjust_column_width        0

cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color none

hide_window_decorations    yes
tab_bar_style              hidden
scrollback_lines           10000

enable_audio_bell          no
visual_bell_duration 2.0 linear
visual_bell_color none

confirm_os_window_close 0

foreground                 #ebdbb2
background                 #1d2021

cursor                     #ebdbb2
cursor_text_color          #282828

selection_foreground       #1d2021
selection_background       #d5c4a1

url_color                  #83a598

color0                     #1d2021
color8                     #665c54

color1                     #cc241d
color9                     #fb4934

color2                     #98971a
color10                    #b8bb26

color3                     #d79921
color11                    #fabd2f

color4                     #458588
color12                    #83a598

color5                     #b16286
color13                    #d3869b

color6                     #689d6a
color14                    #8ec07c

color7                     #a89984
color15                    #ebdbb2

map ctrl+shift+space kitten hints --type regex --regex '\b.+?\b' --program wl-copy
