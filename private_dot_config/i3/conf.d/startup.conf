# vim:ft=i3config
# Autostart for all machines. Machine-specific execs go in the hostname.conf.

exec --no-startup-id "/usr/bin/syncthing serve --no-browser --logflags=0"
exec --no-startup-id dunst
exec --no-startup-id emacs --daemon
exec --no-startup-id ~/.local/bin/battery-notifier
exec --no-startup-id sleep 2 && /usr/bin/volumeicon
exec_always --no-startup-id xsetroot -solid "#32302f"

exec_always --no-startup-id ~/.config/polybar/launch.sh
exec --no-startup-id ~/.local/bin/kanata_linux_x64
exec --no-startup-id ~/.config/i3/scripts/cliphist-watch.sh
exec --no-startup-id udiskie --no-automount --smart-tray

# Input device tuning (fails silently if the device isn't present)
exec --no-startup-id xinput set-prop "ELAN06C8:00 04F3:320B Touchpad" "libinput Tapping Enabled" 1
exec --no-startup-id xinput --set-prop "TPPS/2 Elan TrackPoint" "libinput Accel Profile Enabled" 0, 1
exec --no-startup-id xinput --set-prop "TPPS/2 Elan TrackPoint" "libinput Accel Speed" 0.5
