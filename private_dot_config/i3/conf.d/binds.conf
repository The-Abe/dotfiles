# vim:ft=i3config

# ── Program launchers ────────────────────────────────────────────────────────
bindsym $mod+Return exec ~/.config/i3/rofi-whichkey.py
bindsym $mod+d      exec --no-startup-id "rofi -show combi"
bindsym $mod+s      exec ~/.local/bin/kp
bindsym $mod+x      exec alacritty -e xprop
bindsym Ctrl+$mod+v exec --no-startup-id "clipcat-menu"

# ── Media keys ───────────────────────────────────────────────────────────────
bindsym XF86AudioRaiseVolume exec --no-startup-id "pactl set-sink-volume @DEFAULT_SINK@ +5%; ~/.local/bin/showvolume"
bindsym XF86AudioLowerVolume exec --no-startup-id "pactl set-sink-volume @DEFAULT_SINK@ -5%; ~/.local/bin/showvolume"
bindsym XF86AudioMute        exec --no-startup-id "pactl set-sink-mute @DEFAULT_SINK@ toggle; ~/.local/bin/showvolume"
bindsym XF86AudioPlay        exec playerctl play-pause
bindsym XF86AudioPause       exec playerctl play-pause
bindsym XF86AudioNext        exec playerctl next
bindsym XF86AudioPrev        exec playerctl previous
bindsym button4              exec playerctl next
bindsym button5              exec playerctl previous

# ── Brightness keys ──────────────────────────────────────────────────────────
bindsym XF86MonBrightnessUp   exec --no-startup-id "brightnessctl set 100+; ~/.local/bin/showbrightness"
bindsym XF86MonBrightnessDown exec --no-startup-id "brightnessctl set 100-; ~/.local/bin/showbrightness"

# ── Screenshots ──────────────────────────────────────────────────────────────
bindsym Print       exec flameshot full -p ~/Pictures/Screenshots
bindsym Shift+Print exec flameshot gui  -p ~/Pictures/Screenshots

# ── Workspace switching ($mod+<key>) and moving ($mod+Shift+<key>) ───────────
bindsym $mod+q       workspace $ws1
bindsym $mod+w       workspace $ws2
bindsym $mod+e       workspace $ws3
bindsym $mod+r       workspace $ws4
bindsym $mod+t       workspace $ws5
bindsym $mod+y       workspace $ws6
bindsym $mod+u       workspace $ws7
bindsym $mod+i       workspace $ws8
bindsym $mod+o       workspace $ws9
bindsym $mod+p       workspace $ws10
bindsym $mod+Shift+q move container to workspace $ws1
bindsym $mod+Shift+w move container to workspace $ws2
bindsym $mod+Shift+e move container to workspace $ws3
bindsym $mod+Shift+r move container to workspace $ws4
bindsym $mod+Shift+t move container to workspace $ws5
bindsym $mod+Shift+y move container to workspace $ws6
bindsym $mod+Shift+u move container to workspace $ws7
bindsym $mod+Shift+i move container to workspace $ws8
bindsym $mod+Shift+o move container to workspace $ws9
bindsym $mod+Shift+p move container to workspace $ws10

# ── Window focus and movement (vim-style hjkl) ───────────────────────────────
bindsym $mod+h       focus left
bindsym $mod+j       focus down
bindsym $mod+k       focus up
bindsym $mod+l       focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# Move the current workspace to another monitor
bindsym $mod+Ctrl+h move workspace to output left
bindsym $mod+Ctrl+j move workspace to output down
bindsym $mod+Ctrl+k move workspace to output up
bindsym $mod+Ctrl+l move workspace to output right

# ── Layout ───────────────────────────────────────────────────────────────────
bindsym $mod+b        split h
bindsym $mod+v        split v
bindsym $mod+f        fullscreen toggle
bindsym $mod+n        layout toggle tabbed splitv split
bindsym $mod+space    floating toggle
bindsym $mod+Ctrl+r   mode "resize"

# ── i3 management ────────────────────────────────────────────────────────────
bindsym $mod+Shift+c reload
bindsym $mod+Shift+Escape kill
bindsym $mod+Escape  exec "i3lock -c 000000"

# ── Notifications ────────────────────────────────────────────────────────────
bindsym Ctrl+Escape exec --no-startup-id dunstctl close-all

# ── Resize mode ──────────────────────────────────────────────────────────────
mode "resize" {
  bindsym h       resize grow   left  5 px or 1 ppt
  bindsym Shift+h resize shrink left  5 px or 1 ppt
  bindsym j       resize grow   down  5 px or 1 ppt
  bindsym Shift+j resize shrink down  5 px or 1 ppt
  bindsym k       resize grow   up    5 px or 1 ppt
  bindsym Shift+k resize shrink up    5 px or 1 ppt
  bindsym l       resize grow   right 5 px or 1 ppt
  bindsym Shift+l resize shrink right 5 px or 1 ppt
  bindsym Return  mode "default"
  bindsym Escape  mode "default", exec dunstctl close-all
}

# ── Launch mode ($mod+Shift+d) ───────────────────────────────────────────────
# Quick shortcuts for common apps and screen layout scripts.

for_window [class="Pavucontrol"] floating enable

# ── Misc ─────────────────────────────────────────────────────────────────────
bindsym $mod+a   exec --no-startup-id "~/.config/nvim/add_note.sh"
bindsym $mod+Tab exec alacritty --class "float" -e /usr/bin/zsh -ic "nv-daily"
bindsym $mod+Ctrl+p exec --no-startup-id ~/.config/i3/pomodoro-toggle.sh toggle
