[colors]
; Gruvbox Dark Hard
bg = #1d2021
bg-alt = #282828
bg-soft = #3c3836
fg = #ebdbb2
fg-muted = #a89984
fg-dim = #928374
red = #fb4934
green = #b8bb26
yellow = #fabd2f
blue = #83a598
purple = #d3869b
aqua = #8ec07c
orange = #fe8019

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
bottom = true
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
line-color = ${colors.orange}
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 1
modules-left = i3 xwindow
modules-center =
modules-right = cpu memory filesystem pulseaudio xbacklight network bluetooth battery date powermenu
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-1 = "Noto Sans CJK JP:size=10;3"
font-2 = "Noto Color Emoji:size=2;3"
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[bar/secondary]
monitor = ${env:MONITOR:}
width = 100%
height = 28
bottom = true
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
line-color = ${colors.orange}
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 1
modules-left = i3
modules-center =
modules-right = network bluetooth battery date
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-1 = "Noto Sans CJK JP:size=10;3"
font-2 = "Noto Color Emoji:size=2;3"
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
format = <label-state> <label-mode>
label-focused = %name%
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.orange}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-muted}
label-unfocused-background = ${colors.bg-alt}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.aqua}
label-visible-background = ${colors.bg-alt}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding = 1
label-mode = %mode%
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.yellow}
label-mode-padding = 1

[module/xwindow]
type = custom/script
exec = ~/.config/polybar/scripts/window.sh
interval = 1
format = <label>
label =  %output%
label-foreground = ${colors.fg-muted}
label-maxlen = 70
click-left = i3-msg -q fullscreen toggle
click-right = i3-msg -q kill

[module/cpu]
type = internal/cpu
interval = 2
format = %{A1:~/.config/polybar/scripts/btop.sh:}<label>%{A}
label =   %percentage%%
label-foreground = ${colors.yellow}
label-background = ${colors.bg-alt}
label-padding = 1

[module/memory]
type = internal/memory
interval = 2
format = %{A1:~/.config/polybar/scripts/btop.sh:}<label>%{A}
label =   %percentage_used%%
label-foreground = ${colors.purple}
label-background = ${colors.bg-alt}
label-padding = 1

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 60
fixed-values = true
format-mounted = <label-mounted>
label-mounted =   %percentage_used%%
label-mounted-foreground = ${colors.aqua}
label-mounted-background = ${colors.bg-alt}
label-mounted-padding = 1
click-left = thunar /
click-right = ~/.config/polybar/scripts/df-view.sh

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 1
format-volume = %{A1:pavucontrol >/dev/null 2>&1 &:}<ramp-volume> <label-volume>%{A}
format-volume-foreground = ${colors.blue}
format-volume-background = ${colors.bg-alt}
format-volume-padding = 1
label-volume = %percentage%%
format-muted = %{A1:pavucontrol >/dev/null 2>&1 &:}<label-muted>%{A}
label-muted =  muted
label-muted-foreground = ${colors.red}
label-muted-background = ${colors.bg-alt}
label-muted-padding = 1
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 = 
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/xbacklight]
type = custom/script
exec = ~/.config/polybar/scripts/backlight.sh
interval = 2
format = <label>
label =   %output%%
label-foreground = ${colors.yellow}
label-background = ${colors.bg-alt}
label-padding = 1
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-
click-left = brightnessctl set 100%
click-right = brightnessctl set 10%

[module/network]
type = internal/network
interface = ${env:NET_INTERFACE:wlp0s20f3}
interval = 3
accumulate-stats = true
format-connected = %{A1:nm-connection-editor >/dev/null 2>&1 &:}<label-connected>%{A}
label-connected =   %essid%
label-connected-foreground = ${colors.green}
label-connected-background = ${colors.bg-alt}
label-connected-padding = 1
format-disconnected = %{A1:nm-connection-editor >/dev/null 2>&1 &:}<label-disconnected>%{A}
label-disconnected =   offline
label-disconnected-foreground = ${colors.red}
label-disconnected-background = ${colors.bg-alt}
label-disconnected-padding = 1
click-right = nmcli radio wifi | grep -q enabled && nmcli radio wifi off || nmcli radio wifi on

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.blue}
label-background = ${colors.bg-alt}
label-padding = 1
click-left = blueman-manager
click-right = ~/.config/polybar/scripts/bluetooth.sh toggle

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 100
poll-interval = 5
format-charging = <label-charging>
label-charging =   %percentage%%
label-charging-foreground = ${colors.green}
label-charging-background = ${colors.bg-alt}
label-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.fg}
label-discharging-background = ${colors.bg-alt}
label-discharging-padding = 1
format-full = <label-full>
label-full =   full
label-full-foreground = ${colors.green}
label-full-background = ${colors.bg-alt}
label-full-padding = 1
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/date.sh
interval = 1
format = <label>
label = %output%
label-foreground = ${colors.fg}
label-background = ${colors.bg-soft}
label-padding = 1

[module/powermenu]
type = custom/menu
expand-right = true
label-open = "󰐥"
label-open-foreground = ${colors.red}
label-open-background = ${colors.bg-alt}
label-open-padding = 1
label-close = "󰅖"
label-close-foreground = ${colors.red}
label-close-background = ${colors.bg-alt}
label-close-padding = 1
label-separator = " "
menu-0-0 = " "
menu-0-0-exec = i3lock -c 000000
menu-0-1 = " "
menu-0-1-exec = systemctl suspend
menu-0-2 = " "
menu-0-2-exec = systemctl reboot
menu-0-3 = " "
menu-0-3-exec = systemctl poweroff

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
