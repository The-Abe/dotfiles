# vim:ft=swayconfig
# Autostart for all machines.

# Session environment for DBus/portal-aware apps
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec /usr/bin/syncthing serve --no-browser --logflags=0
exec mako
exec emacs --daemon
exec ~/.local/bin/battery-notifier
exec_always ~/.config/sway/scripts/waybar.sh

# Clipboard history (cliphist via wl-paste — replaces the xclip watcher)
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Keyboard remapping
exec ~/.local/bin/kanata_linux_x64

# Idle / lock / suspend (swayidle + swaylock replace xss-lock + i3lock)
exec swayidle -w timeout 300 'swaylock' timeout 600 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"' before-sleep 'swaylock'

# redshift (optional — matches your Hyprland setup)
#exec redshift
