# vim:ft=swayconfig
# Autostart for all machines.

# Session environment for DBus/portal-aware apps
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec /usr/bin/syncthing serve --no-browser --logflags=0
exec mako
exec emacs --daemon
exec ~/.local/bin/battery-notifier
exec_always ~/.config/sway/scripts/waybar.sh

# Clipboard history (cliphist via wl-paste — replaces the xclip watcher)
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Keyboard remapping
exec ~/.local/bin/kanata_linux_x64

# Idle / lock / suspend (swayidle + swaylock replace xss-lock + i3lock)
# -f keeps swaylock in foreground so swayidle -w waits for it to actually lock
#   before arming the next timeout (avoids racing DPMS with a half-initialized lock)
# -c 000000 gives a black lock background
# after-resume re-asserts dpms on after suspend (systemd builds only)
exec swayidle -w \
  timeout 300 'swaylock -f -c 000000' \
  timeout 600 'swaymsg "output * dpms off"' \
  resume 'swaymsg "output * dpms on"' \
  before-sleep 'swaylock -f -c 000000' \
  after-resume 'swaymsg "output * dpms on"'

# Automount USB/SD cards
exec udiskie --no-automount --smart-tray

# wlsunset (blue light filter — replaces redshift on Wayland)
exec_always wlsunset -l 52.7518774463542 -L 6.887590085312259
