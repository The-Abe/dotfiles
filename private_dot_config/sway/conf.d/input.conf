# vim:ft=swayconfig
# Input devices. Verify device names with `swaymsg -t get_inputs`.

# Caps Lock acts as Escape (was: setxkbmap -option caps:escape)
input * xkb_options caps:escape

# TrackPoint — flat profile, 0.5 speed (was set via xinput in i3)
input "TPPS/2 Elan TrackPoint" {
    accel_profile flat
    pointer_accel 0.5
}

# Touchpad — tap to click
input "ELAN06C8:00 04F3:320B Touchpad" {
    tap enabled
    natural_scroll disabled
}
