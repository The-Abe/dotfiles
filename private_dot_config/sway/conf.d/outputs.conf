# vim:ft=swayconfig
# Outputs. Verify output names with `swaymsg -t get_outputs`.
#
# X11 (xrandr) -> wlroots output names:
#   eDP-1-1  -> eDP-1
#   HDMI-1-1 -> HDMI-A-1
#   DP-1-2   -> DP-2
#   DP-1-1   -> DP-1

# Solid background (was: xsetroot -solid "#32302f")
output * bg #32302f solid_color

# Laptop panel is auto-detected at preferred resolution (1920x1200).
# External monitor layouts are applied by ~/.screenlayout/*.sh.
